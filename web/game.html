<title>四维来客</title>
<meta name="description" content="一只四维生物掉进了无限展开的二维世界。它走到哪，世界就展开到哪。像素挂机游戏。">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  canvas{display:block;width:100vw;height:100vh}
  body>.win{position:fixed}
  .col{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-height:calc(100vh - 200px)}
  #hud{width:196px}
  #chron{width:300px;min-height:0;overflow:hidden}
  #civ{white-space:pre-line;color:var(--dim);margin-bottom:4px}
  #annals{max-height:min(40vh,320px);overflow-y:auto;padding-right:4px}
  #annals p{margin:0 0 4px}
  #annals p{color:var(--dim)}
  #annals p.new{color:var(--tx)}
  #annals p.soon{opacity:.45}
  #annals p.now{color:var(--clay);text-align:center;margin:2px 0 6px}
  #annals b{font-weight:400;color:var(--clay)}
  #pts{font-size:24px;line-height:30px;color:var(--clay);padding:0 2px}
  #hud .field{margin:2px 0 6px}
  #ups{top:12px;right:12px;width:252px;max-height:calc(100vh - 150px);overflow:auto}
  #rows{display:flex;flex-direction:column;gap:2px}
  .up b{display:flex;justify-content:space-between;gap:8px;font-weight:400}
  .up small{display:block;font-size:12px;color:var(--dim)}
  .up.goal b span:last-child{color:var(--clay)}
  .up.full{opacity:.5}
  #origin{color:var(--dim);margin-bottom:4px}
  #origin::before{content:"这张纸的来历";display:block;color:var(--tx)}
  .status{display:flex;gap:2px;margin-top:6px}
  .status .field{flex:1;white-space:nowrap}
  #log{position:fixed;left:12px;bottom:12px;width:min(480px,calc(100vw - 290px))}
  .logbody{display:flex;gap:4px}
  #lines{flex:1;min-width:0;min-height:54px}
  #lines p{margin:0}
  #lines p:not(:last-child){color:var(--dim)}
  .scroll{width:14px;display:flex;flex-direction:column;flex:none}
  .scroll i{height:14px;font-style:normal;font-size:12px;line-height:14px;text-align:center;border:2px solid var(--lo);box-sizing:border-box;background:#fff;color:var(--dim)}
  .scroll span{flex:1;background:repeating-conic-gradient(#cfcac6 0 25%,#f1efed 0 50%) 0 0/4px 4px}
  #radio{right:12px;bottom:12px;width:252px}
  .deck{display:flex;align-items:center;gap:4px}
  .deck .btn{width:40px;padding:0}
  .eq{flex:none;width:56px;height:30px;display:flex;align-items:flex-end;gap:2px;padding:0 2px 2px}
  .eq i{flex:1;height:2px;background:#2c5a40}
  .eq.live i{animation:eq .9s steps(4) infinite alternate}
  .eq.live i:nth-child(2){animation-duration:.7s}.eq.live i:nth-child(3){animation-duration:1.1s}
  .eq.live i:nth-child(4){animation-duration:.6s}.eq.live i:nth-child(5){animation-duration:1.3s}
  @keyframes eq{to{height:18px}}
  #vol{flex:1;min-width:0;appearance:none;background:none;height:18px;cursor:pointer}
  #vol::-webkit-slider-runnable-track{height:6px;background:#6db087;box-shadow:inset 2px 2px 0 #4e8f69}
  #vol::-moz-range-track{height:6px;background:#6db087}
  #vol::-webkit-slider-thumb{appearance:none;width:10px;height:16px;margin-top:-5px;background:#f1efed;border:2px solid #4e8f69;border-radius:0}
  #vol::-moz-range-thumb{width:8px;height:14px;background:#f1efed;border:2px solid #4e8f69;border-radius:0}
  #vol:focus-visible{outline:2px dashed var(--clay)}
  #tune{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tune.hint{color:var(--clay);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .7s}
  .tb{all:unset;box-sizing:border-box;flex:none;height:16px;min-width:16px;padding:0 2px;border:2px solid var(--lo);
    box-shadow:inset 2px 2px 0 var(--hi);background:rgba(255,255,255,.35);line-height:12px;text-align:center;cursor:pointer;color:var(--tx)}
  .tb.wide{padding:0 4px}
  .tb:hover{color:var(--clay)}
  .tb:focus-visible{outline:2px dashed var(--clay);outline-offset:1px}
  .bar .knob{display:none}
  .win.folded>:not(.bar){display:none!important}
  .win.folded>.bar{margin-bottom:0;border-bottom:0;box-shadow:none}
  html.compact #area,html.compact #flat,html.compact #paper,html.compact #hud .btn,
  html.compact #origin,html.compact #ups .up:not(.goal),html.compact .up small,html.compact .status,
  html.compact #lines p:not(:last-child),html.compact .scroll,
  html.compact #eq,html.compact #vol,html.compact #tune,html.compact #next,
  html.compact #civ,html.compact #annals p:not(.new):not(.now){display:none!important}
  #pet{display:none}

  html.pet #pet{display:flex;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px}
  #bubble{width:280px;height:76px;overflow:hidden;margin-bottom:6px}
  #petcv{width:300px;height:50px}
  html.pet #pet{cursor:pointer}
  @media (max-width:640px){
    #hud{width:180px}
    .bar .gems{display:none}
    #chron{display:none!important}
    #radio{top:12px;bottom:auto;width:auto;left:204px}
    #radio #tune,#radio #vol{display:none}
    #ups{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:34vh}
    .col{right:12px;max-height:calc(66vh - 40px);overflow:hidden}
    #log{position:static;align-self:stretch;width:auto}
    #lines p:nth-last-child(n+4){display:none}
    .scroll{display:none}
  }
</style>

<canvas id="cv" aria-label="二维世界"></canvas>
<div class="col">
<section class="win mint" id="hud" hidden>
  <header class="bar"><i class="ico" aria-hidden="true"></i><b>感知.exe</b><span class="gems" aria-hidden="true"><i></i><i></i><i></i></span></header>

</div>
<section class="win beige" id="ups" hidden>

<section class="win mint" id="radio">

  <div class="deck">

  </div>

</section>
<div id="flash"></div>
<div id="pet">
  <div class="win light" id="bubble" hidden aria-live="polite"></div>
  <canvas id="petcv" aria-label="Clawd，点一下展开"></canvas>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let pet = false;                                           // 桌面版的桌宠模式
// ?seed= 来自会话查看器：每条会话一张纸，各存各的档
const SEED = Math.floor(+new URLSearchParams(location.search).get('seed')) || 0;
const TAU = Math.PI * 2, CH = 32, TP = 4, SAVE = 'clawd-4d-v1' + (SEED ? ':' + SEED : '');

// 会话查看器 / 首页用 worldOf() 写进来的：这段对话在二维世界留下的痕迹。没有就是一张普通的纸。
let SRC = {};
try { SRC = SEED && JSON.parse(localStorage.getItem('clawd-4d-world:' + SEED)) || {}; } catch { /* 无痕模式：只用种子 */ }
const n = k => SRC[k] | 0;
const HANDS = n('see') + n('act') + n('make') + n('split') + 1;
const WET = n('see') / HANDS * .06;           // 观看 → 水
const HARD = n('act') / HANDS * .07;          // 动手 → 山
const GREEN = n('make') / HANDS * .25;        // 改写 → 森林
const RIFT = n('errs') ? Math.min(.025, .004 + n('errs') / HANDS * .08) : 0;   // 出错 → 裂缝
const FLATP = n('talk') ? .002 + Math.min(.008, n('talk') * .0003) : .0035;    // 人说的话 → 居民
const SAID = Array.isArray(SRC.said) ? SRC.said : [];
const PAPER = '#fbfaf7', DOT = '#e3ded4', BODY = '#d97757', INK = '#1f1d1b';

// --- 存档 --------------------------------------------------------------------
// 坐标打包成 uint32：每轴 16 位。
// ponytail: 世界上限 ±32768 格，超出会绕回；真有人走到那再换成分块 Set。
const key = (x, y) => ((x + 32768) & 0xffff) * 65536 + ((y + 32768) & 0xffff);
const kx = k => Math.floor(k / 65536) - 32768, ky = k => k % 65536 - 32768;
console.assert(kx(key(-5, 77)) === -5 && ky(key(-5, 77)) === 77, 'key roundtrip');

const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s || ''), c => c.charCodeAt(0));

// 展开过的格子按 32×32 分块存成位图：每块 132 字节（坐标 4 + 位图 128），
// 比早先每格 4 字节小十几倍——那个格式走到一百万格左右就会撑爆 localStorage 的 5MB。
function packRev() {
  const m = new Map();
  for (const k of rev) {
    const x = kx(k), y = ky(k), cx = Math.floor(x / CH), cy = Math.floor(y / CH), ck = cx * 4096 + cy;
    let b = m.get(ck);
    if (!b) m.set(ck, b = [cx, cy, new Uint8Array(128)]);
    const i = (y - cy * CH) * CH + (x - cx * CH);
    b[2][i >> 3] |= 1 << (i & 7);
  }
  const out = new Uint8Array(m.size * 132), dv = new DataView(out.buffer);
  let o = 0;
  for (const [cx, cy, bits] of m.values()) { dv.setInt16(o, cx); dv.setInt16(o + 2, cy); out.set(bits, o + 4); o += 132; }
  return out;
}
function unpackRev(u) {
  const dv = new DataView(u.buffer);
  for (let o = 0; o + 132 <= u.length; o += 132) {
    const cx = dv.getInt16(o) * CH, cy = dv.getInt16(o + 2) * CH;
    for (let i = 0; i < CH * CH; i++) if (u[o + 4 + (i >> 3)] >> (i & 7) & 1) rev.add(key(cx + i % CH, cy + Math.floor(i / CH)));
  }
}

function load() {
  try { return JSON.parse(localStorage.getItem(SAVE)); } catch { return null; }
}
const SAVED = load();
const G = Object.assign({
  seed: SEED || (Math.random() * 2 ** 31) | 0, pts: 0, total: 0, lv: {}, ws: [[0.5, 0.5]],
  rate: 0, flat: 0, heard: 0, seen: {}, t: Date.now(), z: innerWidth < 640 ? 2 : 3, foldT: 0,
}, SAVED || {});
G.age ??= G.civ?.t || 0;                                  // 这张纸存在了多少秒（离线也算）
G.buffs ??= [];
delete G.civ;                                              // 旧版随机的历史不要了
const rev = new Set(G.rev ? new Uint32Array(unb64(G.rev).buffer) : []);   // 旧存档：每格一个 uint32
if (G.revb) unpackRev(unb64(G.revb));
delete G.rev; delete G.revb;

let wiped = false;
function save() {
  if (wiped) return;
  G.t = Date.now();
  G.ws = ws.map(w => [w.x, w.y]);
  try { localStorage.setItem(SAVE, JSON.stringify({ ...G, revb: b64(packRev()) })); } catch { /* 存满了或无痕模式：就当这次没存 */ }
}

// --- 地形：确定性的值噪声 ----------------------------------------------------
function h(x, y, s) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vn(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = h(xi, yi, s), b = h(xi + 1, yi, s), c = h(xi, yi + 1, s), d = h(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y, s) => (vn(x / 40, y / 40, s) * 4 + vn(x / 17, y / 17, s + 1) * 2 + vn(x / 7, y / 7, s + 2)) / 7;

// 地貌主题：同一套噪声高度，换一套名字、颜色、像素花纹和台词，就是另一种世界。
// 每种地形：[名字, 底色, 花纹, 花纹色, 第二花纹色]。花纹见 PAT。
// 主题由种子定：同一段会话永远是同一种地貌；老存档一律留在地球，免得地图突然换色。
const THEMES = {
  earth: { name: '地球', intro: '这张纸上画的像是一颗有水有山的星球。', t: {
    deep: ['深水', [52, 96, 146], 'wave', [92, 136, 176]], water: ['水', [82, 140, 190], 'wave', [122, 180, 220]],
    sand: ['沙', [226, 208, 156], 'none'], grass: ['草地', [128, 174, 92], 'none'],
    forest: ['森林', [96, 148, 76], 'tree', [58, 104, 56], [112, 82, 52]], rock: ['岩石', [156, 148, 134], 'none'],
    peak: ['山', [116, 110, 102], 'dot', [196, 200, 210]], snow: ['雪', [214, 226, 240], 'dot', [246, 248, 252]],
    rift: ['裂缝', [44, 34, 58], 'diag', [150, 110, 220]] }, first: {
    water: '水。它是平的——当然，这里的一切都是平的。',
    deep: '很深的水。在这里，"深"只意味着颜色更暗。',
    sand: '沙。每一粒都是一个点，每个点都没有大小。',
    forest: '树。我能同时看见它的每一圈年轮。',
    rock: '石头。二维的石头硌不到四维的脚。',
    peak: '山。它们管这叫"高"，其实只是更难绕过去。',
    snow: '雪。在一个没有"上面"的世界里，雪是从哪里落下来的？',
    rift: '裂缝。那段对话在这里出过错，纸被划破了。我能从破口看见下面。' } },
  foil: { name: '二向箔', intro: '这张纸……不是画出来的。是一整个星系被压平以后铺成的。', t: {
    deep: ['摊开的海', [40, 62, 120], 'stripe', [70, 98, 160]], water: ['平面的浪', [88, 120, 196], 'stripe', [140, 170, 230]],
    sand: ['压平的海岸', [220, 196, 170], 'none'], grass: ['展开的城市', [176, 170, 190], 'grid', [128, 120, 148]],
    forest: ['叶子全摊开的森林', [70, 150, 110], 'speck', [150, 220, 160]], rock: ['展开的地壳', [168, 120, 96], 'ring', [196, 150, 120]],
    peak: ['压成等高线的山', [132, 96, 84], 'ring', [210, 170, 140]], snow: ['太阳的边缘', [250, 214, 120], 'dot', [255, 246, 210]],
    rift: ['二向箔的边缘', [20, 20, 28], 'diag', [200, 200, 255]] }, first: {
    deep: '这片海曾经有深度。现在它的每一层都摊在我面前，像一本被拆开的书。',
    water: '浪还在，只是不会再落下来了。',
    sand: '海岸被压得很平，平到连「边」都快没有了。',
    grass: '一座城被完整地展开了。我能同时看见每一个房间，和房间里没来得及收起的东西。',
    forest: '每一片叶子都摊开了，一片也没重叠。原来一棵树有这么多叶子。',
    rock: '地壳被一圈一圈剥开铺平，像年轮，只是更老。',
    peak: '山被压成了等高线。它们以前是站着的。',
    snow: '太阳的边缘。连它也没逃过。',
    rift: '二向箔的边缘还在往外铺。我退了半步——对我来说，只是往第四个方向挪一下。' } },
  dune: { name: '沙丘', intro: '这张纸是一整片沙漠。水在这里比什么都贵。', t: {
    deep: ['盐渊', [120, 96, 84], 'none'], water: ['盐壳', [222, 214, 196], 'dot', [248, 244, 236]],
    sand: ['流沙', [222, 176, 110], 'wave', [240, 200, 140]], grass: ['沙丘', [206, 150, 82], 'wave', [226, 176, 110]],
    forest: ['香料田', [214, 120, 48], 'speck', [246, 170, 80]], rock: ['岩脊', [150, 112, 86], 'none'],
    peak: ['屏障山', [110, 80, 66], 'dot', [170, 130, 100]], snow: ['极冠', [236, 226, 210], 'dot', [252, 248, 240]],
    rift: ['沙虫的通道', [70, 46, 36], 'diag', [200, 140, 80]] }, first: {
    deep: '盐渊。这里曾经有过水，水走的时候把盐留下了。',
    water: '盐壳。踩上去会响，可惜我没有重量。',
    sand: '流沙。在二维里，陷下去就是……往旁边挪？',
    grass: '沙丘。每一道都在很慢很慢地走。',
    forest: '香料。整片地都是橙色的，闻起来像时间。',
    rock: '岩脊。沙漠里唯一不动的东西。',
    peak: '屏障山。风在这里拐了个弯。',
    snow: '极冠。整张纸上唯一的一点水，冻在最远的地方。',
    rift: '沙虫的通道。它从下面经过——这里也有「下面」吗？' } },
  solaris: { name: '索拉里斯', intro: '这张纸的大部分是海，而且那片海好像在看我。', t: {
    deep: ['活的海', [30, 90, 100], 'wave', [60, 150, 150]], water: ['海的表面', [60, 140, 140], 'wave', [120, 200, 190]],
    sand: ['泡沫滩', [200, 220, 210], 'dot', [240, 250, 246]], grass: ['胶质平原', [196, 140, 170], 'none'],
    forest: ['对称体', [150, 90, 160], 'spike', [210, 160, 220]], rock: ['雾岩', [150, 160, 170], 'none'],
    peak: ['被双日照着的山', [190, 110, 90], 'dot', [120, 160, 230]], snow: ['拟态体', [230, 220, 236], 'ring', [200, 180, 220]],
    rift: ['海里的一道裂口', [16, 30, 36], 'diag', [120, 230, 210]] }, first: {
    deep: '这片海是活的。我看它的时候，它也在看我。',
    water: '海的表面在慢慢起伏，像在想事情。',
    sand: '泡沫滩。海想到一半的念头，被冲上了岸。',
    grass: '胶质平原，软的，微微发光。',
    forest: '对称体。海每隔一阵就造出一座，又把它拆掉。',
    rock: '雾岩。雾是从海里升起来的，但这里没有「升」。',

const THEME_KEYS = Object.keys(THEMES);

const VAL = { deep: 1, water: 1, sand: 1, grass: 1, forest: 2, rock: 2, peak: 3, snow: 5, rift: 4 };
const T = Object.fromEntries(Object.entries(TH.t).map(([k, [name, c, p, a, a2]]) => [k, { name, c, p, a, a2, v: VAL[k] }]));
// 4×4 格子里哪些像素用花纹色：1 = 花纹色，2 = 第二花纹色。r 是这一格的随机数，让花纹不是每格都有
const PAT = {
  none: () => 0,
  tree: (i, j, r) => r < .55 ? ((j === 0 && (i === 1 || i === 2)) || j === 1 ? 1 : j === 2 && i === 1 ? 2 : 0) : 0,
  wave: (i, j, r) => r < .2 && j === 1 && i > 0 && i < 3 ? 1 : 0,
  dot: (i, j, r) => r < .3 && j === 1 && i === 1 ? 1 : 0,
  diag: (i, j, r) => r < .3 && i === j ? 1 : 0,
  spike: (i, j, r) => r < .5 && i === 1 + (r < .25) && j < 3 ? 1 : 0,
  grid: (i, j) => i === 0 || j === 0 ? 1 : 0,
  ring: (i, j, r) => r < .45 && (i === 0 || i === 3 || j === 0 || j === 3) ? 1 : 0,
  stripe: (i, j) => j === 1 || j === 3 ? 1 : 0,

// 阈值按噪声分位数定的：深水 12% 水 12% 沙 5% 陆地 43% 岩 13% 山 9% 雪 6%
function tile(x, y) {
  const e = fbm(x, y, G.seed);
  if (e < .33 + WET / 2) return 'deep';
  if (e < .395 + WET) return 'water';
  if (RIFT && Math.abs(vn(x / 19, y / 19, G.seed + 40) - .5) < RIFT) return 'rift';
  if (e < .417 + WET) return 'sand';
  if (e < .59 - HARD) return vn(x / 23, y / 23, G.seed + 7) > .55 - GREEN ? 'forest' : 'grass';
  return e < .65 - HARD / 2 ? 'rock' : e < .72 - HARD / 3 ? 'peak' : 'snow';
}

// 平面国居民
const FLATV = 40;
const FCOL = [[[214, 72, 72], '红'], [[58, 108, 214], '蓝'], [[232, 178, 36], '黄'], [[150, 80, 196], '紫']];
const FSHP = [
  ['三角形', ['....', '.#..', '###.', '....']],
  ['正方形', ['....', '.##.', '.##.', '....']],
  ['圆', ['.##.', '####', '####', '.##.']],
];
const isFlat = (x, y, t) => (t === 'grass' || t === 'sand' || t === 'forest') && h(x, y, G.seed + 99) < FLATP;

// --- 分块画布：每格 4×4 个美术像素 ---------------------------------------------
const chunks = new Map();
function chunk(cx, cy) {
  const k = cx + ',' + cy;
  let c = chunks.get(k);
  if (!c) {
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = CH * TP;
    const g = cvs.getContext('2d');
    c = { cvs, g, img: g.createImageData(CH * TP, CH * TP), dirty: false };
    chunks.set(k, c);
  }
  return c;
}

function paint(x, y) {
  const cx = Math.floor(x / CH), cy = Math.floor(y / CH), c = chunk(cx, cy), d = c.img.data;
  const t = tile(x, y), lx = (x - cx * CH) * TP, ly = (y - cy * CH) * TP;
  const colour = L('color') > 0, r0 = h(x, y, G.seed + 11);
  const fl = L('life') > 0 && isFlat(x, y, t) && flatOf(x, y);
  for (let j = 0; j < TP; j++) for (let i = 0; i < TP; i++) {
    const q = T[t], pv = PAT[q.p](i, j, r0);
    let [r, g, b] = pv === 2 ? q.a2 : pv === 1 ? q.a : q.c;
    if (fl && fl[1][1][j][i] === '#') [r, g, b] = fl[0][0];
    const hk = seen() && TOWN.get(key(x, y)), hc = hk && HOUSE[hk][j][i];
    if (hc && hc !== '.') [r, g, b] = hc === 'R' ? FCOL[Math.floor(r0 * 4)][0] : hk === 'ruin' ? [150, 144, 134] : HCOL[hc];
    const n = (h(x * TP + i, y * TP + j, G.seed + 3) - .5) * 12;
    r += n; g += n; b += n;
    if (!colour) r = g = b = 90 + (r * .3 + g * .59 + b * .11) * .6;
    const o = ((ly + j) * CH * TP + lx + i) * 4;
    d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
  }
  c.dirty = true;
}
const repaintAll = () => { for (const k of rev) paint(kx(k), ky(k)); };

const WANT = {

  life: 2 + Math.min(4, n('talk') / 10), mult: 1 + Math.min(3, n('think') / 20),

function decide() {

    if (l >= u.max || (u.need && !L(u.need))) continue;
    const sc = u.cost(l) / WANT[u.id];
    if (sc < bs) { bs = sc; goal = u; }
  }

}

function buy(u) {
  const l = L(u.id), c = Math.ceil(u.cost(l));
  if (l >= u.max || G.pts < c) return;
  G.pts -= c;
  G.lv[u.id] = l + 1;

  if (u.id === 'clone') addWalker(ws[0].x, ws[0].y);
  if (u.id === 'color') repaintAll();
  if (u.id === 'life') {

const ws = [];
function addWalker(x, y) {
  const a = Math.random() * TAU;
  const w = { x, y, tx: x, ty: y, hx: Math.cos(a), hy: Math.sin(a), k: -1, anim: 0 };
  retarget(w);
  ws.push(w);
}

// 往前方大致没展开的地方走：随机抽样，偏向当前朝向。找不到就把圈放大。
function retarget(w) {
  for (let ring = radius() + 3; ring <= 512; ring *= 2) {
    let best = null, bs = -9;
    for (let n = 0; n < 20; n++) {
      const a = Math.random() * TAU, d = ring * (.6 + Math.random() * .4);
      const x = Math.floor(w.x + Math.cos(a) * d), y = Math.floor(w.y + Math.sin(a) * d);
      if (rev.has(key(x, y))) continue;
      const sc = Math.cos(a) * w.hx + Math.sin(a) * w.hy + Math.random() * 1.2;
      if (sc > bs) { bs = sc; best = [x + .5, y + .5]; }
    }
    if (best) { [w.tx, w.ty] = best; return; }
  }
  const a = Math.random() * TAU;
  w.tx = w.x + Math.cos(a) * 60; w.ty = w.y + Math.sin(a) * 60;
}

function reveal(cx, cy, r) {
  let gain = 0;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx * dx + dy * dy > r * r + r) continue;
    const x = cx + dx, y = cy + dy, k = key(x, y);
    if (rev.has(k)) continue;
    rev.add(k);
    paint(x, y);
    const t = tile(x, y);
    gain += T[t].v;
    if (!G.seen[t]) { G.seen[t] = 1; if (FIRST[t]) say(FIRST[t]); }
    if (L('life') && isFlat(x, y, t)) { gain += FLATV; meet(x, y); }
  }
  if (gain) earn(gain * mult() * buff());
  for (const m of MILES) if (rev.size >= m[0] && !G.seen['m' + m[0]]) { G.seen['m' + m[0]] = 1; say(m[1]); }
}

let secGain = 0;
function earn(v) { G.pts += v; G.total += v; secGain += v; }

function meet(x, y) {
  G.flat++;
  const [[, cn], [sn]] = flatOf(x, y);
  if (pet) return say(`我从一个${cn}色${sn}上面跨了过去。在它看来，我凭空消失了一瞬间。`, { chat: true, bubble: true });
  if (SAID.length) return say(`遇见一个${cn}色的${sn}。它反复念着一句从上方掉下来的话：「${SAID[G.heard++ % SAID.length]}」`, { chat: true });
  const sees = ['一段会变长变短的橙色线段', '一团忽大忽小的颜色', '一个不讲道理的影子', '天气'];
  say(`遇见一个${cn}色的${sn}。它把我看成了${sees[Math.floor(Math.random() * sees.length)]}。`, { chat: true });

// 不在的时候按离开前的速度折半算，不模拟地图。
// ponytail: 离线期间地图不会展开，只给感知；想要离线也画地图就在这里跑一段简化模拟。
function away(sec) {
  const y0 = yearNow();
  G.age += sec;
  advance(true);
  if (seen() && yearNow() > y0) say(`你不在的时候，它们过了 ${yearNow() - y0} 年。纪年里记着。`);
  sec = Math.min(sec, 8 * 3600);
  const v = G.rate * sec * .5;
  if (v < 10) return;
  earn(v);
  const m = Math.round(sec / 60);
  say(`你离开的 ${m >= 60 ? (m / 60).toFixed(1) + ' 小时' : Math.max(m, 1) + ' 分钟'}里，我在纸面上继续游荡，带回 ${fmt(v)} 感知。`);
}

const fmt = n => n < 1e4 ? Math.floor(n).toLocaleString() :

// 按现在的速度还要攒多久；速度还没稳下来就不说
const eta = need => {
  if (need <= 0 || G.rate < 1) return '';
  const t = need / G.rate;
  return ' · ' + (t < 60 ? `${Math.ceil(t)} 秒` : t < 3600 ? `${Math.ceil(t / 60)} 分` : `${(t / 3600).toFixed(1)} 小时`);
};
function hud() {

    if (goal === u || l) G.seen['u' + u.id] = 1;
    b.hidden = !G.seen['u' + u.id];
    any ||= !b.hidden;
    b.classList.toggle('clay', goal === u);
    b.classList.toggle('goal', goal === u);
    b.classList.toggle('full', full);
    name.textContent = u.max > 1 ? `${u.name} Lv.${l}` : u.name;
    cost.textContent = full ? '—' : goal === u ? `攒着 ${Math.min(99, Math.floor(G.pts / c * 100))}%${eta(c - G.pts)}` : `◆ ${fmt(c)}`;
    info.textContent = full ? (u.max > 1 ? u.info(l) + ' · 满了' : '已看见') : u.info(l + 1);
  }
  $('ups').hidden = !any;
}

$('reset').onclick = () => {
  if (!confirm('从一片空白重新开始？现在的纸面会全部消失。')) return;
  wiped = true;
  try { localStorage.removeItem(SAVE); } catch { /* 无痕模式 */ }
  location.reload();

// --- 画面 --------------------------------------------------------------------
const SPRITE = [
  '..##########..',
  '..##.####.##..',
  '..##.####.##..',
  '##############',
  '##############',
  '..##########..',
];
const cam = { x: 0, y: 0 };
let dpr = 1;
function resize() {
  dpr = devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);

function drawClawd(sx, sy, s, w, g = ctx) {
  const moving = Math.hypot(w.tx - w.x, w.ty - w.y) > .05;
  const step = moving ? Math.floor(w.anim / .14) % 2 : 2;
  const x0 = Math.round(sx - 7 * s), y0 = Math.round(sy - 8 * s);
  g.fillStyle = 'rgba(31,29,27,.16)';
  g.fillRect(x0 + 2 * s, y0 + 8 * s, 10 * s, s);
  g.fillStyle = BODY;
  SPRITE.forEach((row, j) => {
    for (let i = 0; i < 14; i++) if (row[i] === '#') g.fillRect(x0 + i * s, y0 + j * s, s, s);
  });
  [2, 4, 9, 11].forEach((i, n) => {
    const lift = step < 2 && (n % 2) === step;
    g.fillRect(x0 + i * s, y0 + 6 * s, s, (lift ? 1 : 2) * s);
  });
  g.fillStyle = INK;
  g.fillRect(x0 + 4 * s, y0 + s, s, 2 * s);
  g.fillRect(x0 + 9 * s, y0 + s, s, 2 * s);
}

// 昼夜：纸是被你房间里的光照亮的——光从一个二维居民不存在的方向来，所以跟着你那边的真实时间走。
// 5–7 点天亮，17–19 点天黑。?hour=22 可以强行指定钟点，调画面用。
const FORCE_HOUR = new URLSearchParams(location.search).get('hour');
function daylight() {
  const d = new Date(), hr = FORCE_HOUR != null ? +FORCE_HOUR : d.getHours() + d.getMinutes() / 60;
  if (hr < 5 || hr >= 19) return 0;
  if (hr >= 7 && hr < 17) return 1;
  return hr < 7 ? (hr - 5) / 2 : 1 - (hr - 17) / 2;
}
// 夜里偏蓝变暗，黄昏清晨偏暖；Clawd 的光从第四个方向来，不受影响，所以画在这层之上
function shade(W, H, dl, ox, oy, tp, s) {
  if (dl >= 1) return;
  const night = [58, 70, 122], dusk = [255, 186, 132], w = (1 - Math.abs(dl - .5) * 2) * .55;
  const c = night.map((v, i) => Math.round((v + (255 - v) * dl) * (1 - w) + dusk[i] * w));
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${c})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  if (dl > .6 || !seen()) return;
  ctx.globalAlpha = Math.min(1, (.6 - dl) * 2.5);          // 城里亮起灯
  ctx.fillStyle = '#ffd779';
  for (const [k, kind] of TOWN) {
    if (kind === 'road' || kind === 'ruin' || !rev.has(k)) continue;
    const x = kx(k) * tp + ox + s * (kind === 'temple' ? 1.5 : 2), y = ky(k) * tp + oy + s * 2;
    if (x < -tp || y < -tp || x > W || y > H) continue;
    ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  if (pet) return;
  const W = cv.width, H = cv.height, s = Math.max(1, Math.round(G.z * dpr)), tp = TP * s;
  const ox = Math.round(W / 2 - cam.x * tp), oy = Math.round(H / 2 - cam.y * tp);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // 空白纸面上的点阵，不然一开始根本看不出在动
  ctx.fillStyle = DOT;
  const g = 8 * tp;
  for (let x = ((ox % g) + g) % g; x < W; x += g)
    for (let y = ((oy % g) + g) % g; y < H; y += g) ctx.fillRect(x, y, s, s);

  const cp = CH * tp;
  for (let cy = Math.floor(-oy / cp); cy * cp + oy < H; cy++)
    for (let cx = Math.floor(-ox / cp); cx * cp + ox < W; cx++) {
      const c = chunks.get(cx + ',' + cy);
      if (!c) continue;
      if (c.dirty) { c.g.putImageData(c.img, 0, 0); c.dirty = false; }
      ctx.drawImage(c.cvs, cx * cp + ox, cy * cp + oy, cp, cp);
    }

  shade(W, H, daylight(), ox, oy, tp, s);
  for (const w of [...ws].sort((a, b) => a.y - b.y)) drawClawd(w.x * tp + ox, w.y * tp + oy, s, w);
}

cv.addEventListener('wheel', e => {
  e.preventDefault();
  G.z = Math.min(8, Math.max(1, G.z + (e.deltaY < 0 ? 1 : -1)));
}, { passive: false });

// --- 主循环 ------------------------------------------------------------------
let last = performance.now(), secT = 0, hudT = 0, saveT = 0, civT = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 5) away(dt);          // 标签页被切走过
  else G.age += Math.max(dt, 0);
  dt = Math.min(Math.max(dt, 0), .1);

  if (!pet) for (const w of ws) {
    if (rev.has(key(Math.floor(w.tx), Math.floor(w.ty)))) retarget(w);
    const dx = w.tx - w.x, dy = w.ty - w.y, d = Math.hypot(dx, dy), st = speed() * dt;
    if (d <= st) { w.x = w.tx; w.y = w.ty; retarget(w); }
    else { w.x += dx / d * st; w.y += dy / d * st; w.hx = dx / d; w.hy = dy / d; }
    const x = Math.floor(w.x), y = Math.floor(w.y), k = key(x, y);
    if (k !== w.k) { w.k = k; reveal(x, y, radius()); }
    w.anim += dt;
  }

  if (!pet && L('fold') && (G.foldT += dt) >= foldCD()) {
    G.foldT = 0;
    const w = ws[0], a = Math.random() * TAU, d = 70 + Math.random() * 90;
    w.x += Math.cos(a) * d; w.y += Math.sin(a) * d;
    retarget(w);
    cam.x = w.x; cam.y = w.y;
    $('flash').style.transition = 'none';
    $('flash').style.opacity = 1;
    requestAnimationFrame(() => { $('flash').style.transition = ''; $('flash').style.opacity = 0; });
    if (!G.seen.fold1) { G.seen.fold1 = 1; say('我把纸对折了一下，从这一头直接踩到了那一头。'); }
  }

  const f = Math.min(1, dt * 4);
  cam.x += (ws[0].x - cam.x) * f;
  cam.y += (ws[0].y - cam.y) * f;

  if ((secT += dt) >= 1) { G.rate = G.rate * .8 + secGain / secT * .2; secGain = 0; secT = 0; }
  advance(false);
  const dl = daylight();
  if (seen() && HIST.era[yearNow()] >= 1) earn(live.town * (1 + HIST.era[yearNow()]) * .6 * mult() * buff() * (1.5 - .5 * dl) * dt);   // 城镇也在想你，夜里想得更多
  const phase = dl < .5 ? 'night' : 'day';
  if (G.phase && G.phase !== phase) { bubbleAt = -1e9; say(phase === 'night' ? '天黑了。纸面上的城一个个亮起灯。它们不知道光从哪来，也不知道它为什么会走。' : '天亮了。光又从那个它们不存在的方向照了下来。', { bubble: true }); }
  G.phase = phase;
  if ((hudT += dt) >= .2) { hudT = 0; decide(); hud(); }
  if ((civT += dt) >= 1) { civT = 0; annals(); }
  if ((saveT += dt) >= 5) { saveT = 0; save(); }
  if ((museAt -= dt) <= 0) { museAt = 60 + Math.random() * 60; muse(); }   // 独白 1–2 分钟一句

  if (pet) petTick(dt);
  draw();
  requestAnimationFrame(frame);
}

// --- 平面国：一部载入时就已经写完的历史 --------------------------------------------
// 历史是种子（也就是那段会话）的纯函数：载入时从元年一路推演到它们离开纸面那年，
// 每年的人口、觉察、纪元，每件事，每座建筑建在哪、哪年毁掉，全在 HIST 里。
// 游戏里的「现在」只是随真实时间前进的光标；买下「居民」后，四维生物能看见整条时间线，包括还没到的部分。
// 同一个会话文件永远是同一部历史；唯一的随机是「直接开始」那张纸自己的种子。Clawd 走哪条路不算历史。
const YEAR = 8;                                            // 现实 8 秒 = 二维历一年
const ERAS = ['游荡', '村落', '城邦', '几何', '觉醒'];
const HOUSE = {
  town: ['.RR.', 'RRRR', 'WWDW', 'WWDW'], house: ['....', '.RR.', 'RRRR', 'WDWW'],
  temple: ['.GG.', 'GWWG', 'GWWG', 'GGGG'], ruin: ['W...', 'W.W.', 'WWW.', '....'], road: ['.PP.', 'PPPP', 'PPPP', '.PP.'],
};
const HCOL = { W: [239, 228, 207], D: [91, 70, 54], G: [227, 181, 59], P: [205, 184, 142] };
const LAND = t => t === 'grass' || t === 'sand' || t === 'forest';

function mulberry(a) {
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const HIST = (() => {
  const rnd = mulberry(G.seed ^ 0x5eed);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const folk = () => `${pick(FCOL)[1]}色${pick(FSHP)[0]}`;
  const share = k => n(k) / HANDS;
  const think = 1 + Math.min(.5, n('think') / 400);       // 想得多的对话，居民更早察觉你
  const S = { y: 0, pop: 12, awe: 0, era: 0, next: 4, once: {}, towns: new Map() };
  const H = { events: [], pop: [], awe: [], era: [], end: 0, asc: null };
  let fx = [];                                             // 当前这件事落到地图上的改动

  const count = k => { let c = 0; for (const t of S.towns.values()) c += t[2] === k; return c; };
  const awe = v => { S.awe += v * think; };
  const grow = f => { S.pop *= 1 + f; };
  const boost = (m, sec) => fx.push(['buff', m, sec]);
  const put = (x, y, kind) => { S.towns.set(key(x, y), [x, y, kind]); fx.push(['put', x, y, kind]); };
  // 城从落地点附近往外长；只挑陆地，离别的建筑远一点
  function site(gap = 6) {
    for (let i = 0; i < 80; i++) {
      const a = rnd() * TAU, d = 4 + rnd() * (12 + 6 * count('town'));
      const x = Math.round(Math.cos(a) * d), y = Math.round(Math.sin(a) * d);
      if (!LAND(tile(x, y))) continue;
      let ok = true;
      for (const [tx, ty, k] of S.towns.values()) if (k !== 'road' && Math.abs(tx - x) + Math.abs(ty - y) < gap) { ok = false; break; }
      if (ok) return [x, y];
    }
  }
  const build = kind => { const p = site(); if (p) put(p[0], p[1], kind); return !!p; };
  function village() {
    const p = site();
    if (!p) return false;
    put(p[0], p[1], 'town');
    for (let i = 0; i < 4; i++) {
      const x = p[0] + Math.round(rnd() * 4 - 2), y = p[1] + Math.round(rnd() * 4 - 2);
      if (LAND(tile(x, y)) && !S.towns.has(key(x, y))) put(x, y, 'house');
    }
    return true;
  }
  const towns = () => [...S.towns.values()].filter(t => t[2] === 'town');
  function road() {
    const t = towns();
    if (t.length < 2) return false;
    const a = pick(t), b = t.filter(o => o !== a).sort((p, q) => Math.hypot(p[0] - a[0], p[1] - a[1]) - Math.hypot(q[0] - a[0], q[1] - a[1]))[0];
    const d = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
    if (d > 60) return false;
    for (let i = 1; i < d; i++) {
      const x = Math.round(a[0] + (b[0] - a[0]) * i / d), y = Math.round(a[1] + (b[1] - a[1]) * i / d);
      if (LAND(tile(x, y)) && !S.towns.has(key(x, y))) put(x, y, 'road');
    }
    return true;
  }
  function ruin() {
    const t = towns();
    if (t.length < 2) return false;
    const [x, y] = pick(t);
    put(x, y, 'ruin');
    return true;
  }
  function chart(r = 6) {                                  // 居民替你把城外画进地图
    const t = towns();
    if (!t.length) return false;
    const [x, y] = pick(t);
    fx.push(['chart', x + Math.round(rnd() * 16 - 8), y + Math.round(rnd() * 16 - 8), r]);
    return true;
  }

  const ERA_UP = [
    [() => S.pop >= 20, () => village() && '第一个村子出现了：一圈首尾相接的线。它们管里面叫「家」，外面叫「外面」。'],
    [() => count('town') >= 3 && S.pop >= 200, () => '村子长成了城邦。城墙越修越厚——在这里，「厚」是最贵的形容词。'],
    [() => S.pop >= 900 && S.awe >= 30, () => '它们开始研究几何。第一个问题是：那个橙色的东西，到底有几条边？'],
    [() => S.awe >= 200, () => '一个正方形在夜里「抬起头」——它们本来没有这个方向——看见了我。纸面开始觉醒。'],
  ];
  // 事件表：era 起始纪元，max 最晚纪元，once 只发生一次；w 返回 0 就不会被抽到；run 返回 false 算没发生
  // 那段对话的习惯改权重：改写多→爱建村，观看多→爱测绘，动手多→爱吵架打仗，出错→裂缝教派
  const EV = [
    { id: 'fire', era: 0, max: 0, w: () => 2, run: () => (grow(.1), `一个${folk()}发现了火。在这里，火是一条会自己变长的橙色线段。`) },
    { id: 'name', era: 0, once: 1, w: () => S.awe >= 1 ? 4 : 0, run: () => (awe(2), '它们给那个会突然出现的橙色东西起了名字：「厚的」。') },
    { id: 'trek', era: 0, max: 1, w: () => 1, run: () => `一队${folk()}沿着一条忽然有了颜色的路迁徙。那是我走过的地方。` },
    { id: 'village', era: 1, w: () => count('town') < 2 + S.era * 3 ? 3 * (1 + 2 * share('make')) : 0,
      run: () => village() && `${folk()}们又围出了一个村子。墙首尾相接，就算是家了。` },
    { id: 'harvest', era: 1, w: () => 2, run: () => (boost(1.5, 60), '丰收节。全村排成一条线跳舞——也只能排成一条线。（感知 ×1.5，60 秒）') },
    { id: 'north', era: 1, w: () => 1 + 3 * share('act'), run: () => (grow(-.1), '两个村子为「哪边是北」吵了三年，谁也没说服谁。') },
    { id: 'door', era: 1, once: 1, w: () => 1, run: () => '它们发明了门：在墙上开一个缺口，走过去，再把缺口补上。' },
    { id: 'rift', era: 1, once: 1, w: () => RIFT ? 3 : 0, run: () => build('temple') && (awe(5), '一群居民搬到裂缝旁边，说那是世界的背面，在那儿盖了第一座庙。（感知永久 +10%）') },
    { id: 'verse', era: 1, w: () => SAID.length ? 1.5 : 0, run: () => (awe(1), `它们把一句从天上掉下来的话刻在了村口：「${pick(SAID)}」`) },
    { id: 'road', era: 2, w: () => count('town') >= 2 ? 2 : 0, run: () => road() && '两座城之间修通了一条路。在这里，路和墙长得一模一样，只是方向不同。' },
    { id: 'census', era: 2, w: () => 1, run: () => `城邦做了人口普查：${fmt(S.pop)} 个居民。圆被登记成贵族，因为它们的边最多。` },
    { id: 'map', era: 2, w: () => 1 + 3 * share('see'), run: () => chart() && '测绘师走出城外，把一片空白画进了地图。我顺着看过去，那里真的有东西了。' },
    { id: 'temple', era: 2, w: () => S.awe >= 15 * (count('temple') + 1) && count('temple') < 10 ? 2 : 0,
      run: () => build('temple') && (awe(1), '它们给我修了一座神殿，门朝着它们以为我来的方向——其实我是从每个方向来的。（感知永久 +10%）') },
    { id: 'war', era: 2, w: () => count('town') >= 4 ? 1 + 3 * share('act') : 0,
      run: () => ruin() && (grow(-.15), '两座城为一块沙地开战。从上面看，两支军队只是两条互相靠近的线。有一座城没能留下来。') },
    { id: 'market', era: 2, w: () => 1.5, run: () => (boost(2, 45), '集市日。每个居民都在用自己的边长讨价还价。（感知 ×2，45 秒）') },
    { id: 'measure', era: 3, w: () => 1.5, run: () => (awe(4), '几何学家测量了我留下的脚印，结论是：我的面积是负数。') },
    { id: 'jail', era: 3, once: 1, w: () => 2, run: () => (awe(8), `一个${pick(FCOL)[1]}色正方形宣称存在「上方」，被判终身监禁。它说的是对的。`) },
    { id: 'angles', era: 3, w: () => 1, run: () => (boost(1.8, 90), '它们证明了三角形内角和是 180 度，然后花了一整代人怀疑这件事。（感知 ×1.8，90 秒）') },
    { id: 'many', era: 3, once: 1, w: () => n('split') ? 3 : .5, run: () => (awe(6), '它们终于发现我不止一个：同一种橙色，同时出现在两座城里。') },
    { id: 'lens', era: 3, w: () => 1, run: () => chart(12) && '它们磨出第一块透镜，看见了很远的地方。远处原来不是空白，只是还没人看。' },
    { id: 'letter', era: 4, w: () => 2, run: () => (awe(3), SAID.length ? `它们在地上写了很大的字给我看：「${pick(SAID)}」——是我听过的话。` : '它们在地上写了很大的字给我看：「你好，厚的。」') },
    { id: 'ascend', era: 4, once: 1, w: () => S.awe >= 400 ? 50 : 0, run: () => '第一个居民离开了纸面一点点。它回来说：上面很冷，但能看见所有人。（感知永久 ×2）' },
  ];
  const log = text => H.events.push({ y: S.y, text, fx });

  log('元年。纸面上有了第一批会动的形状。它们还不知道自己是平的。');
  for (let y = 1; y < 6000 && H.asc == null; y++) {
    S.y = y;
    const cap = 40 + count('town') * (150 + 100 * S.era);
    S.pop = Math.max(5, S.pop + (.24 + .08 * S.era) * S.pop * (1 - S.pop / cap));
    S.awe += (.08 + .03 * S.era + .02 * count('temple')) * think;
    fx = [];
    if (S.era < 4 && ERA_UP[S.era][0]()) { const t = ERA_UP[S.era][1](); if (t) { S.era++; log(t); fx = []; } }
    if (--S.next <= 0) {
      S.next = 6 + Math.floor(rnd() * 6);                  // 每 6–11 年一件事
      const ok = EV.map(e => [e, S.era >= e.era && S.era <= (e.max ?? 9) && !(e.once && S.once[e.id]) ? e.w() : 0]).filter(x => x[1] > 0);
      let r = rnd() * ok.reduce((a, x) => a + x[1], 0);
      for (const [e, w] of ok) {
        if ((r -= w) > 0) continue;
        const text = e.run();
        if (text) { if (e.once) S.once[e.id] = 1; log(text); if (e.id === 'ascend') H.asc = y; }
        break;
      }
    }
    H.pop[y] = S.pop; H.awe[y] = S.awe; H.era[y] = S.era;
  }
  H.pop[0] = 12; H.awe[0] = 0; H.era[0] = 0;
  H.end = H.pop.length - 1;
  return H;
})();

// --- 光标：把「现在」之前的历史落到地图上 -----------------------------------------
const TOWN = new Map(), live = { town: 0, house: 0, temple: 0, ruin: 0, road: 0 };
let cursor = 0;
const yearNow = () => Math.min(Math.floor(G.age / YEAR), HIST.end);
const seen = () => L('life') > 0;                          // 买了「居民」才看得见它们和它们的历史
const ascended = () => HIST.asc != null && yearNow() >= HIST.asc;
function buff() {
  G.buffs = G.buffs.filter(b => b[1] > G.age);
  return G.buffs.reduce((a, b) => a * b[0], 1);
}
function put(x, y, kind) {
  const k = key(x, y), was = TOWN.get(k);
  if (was) live[was]--;
  TOWN.set(k, kind);
  live[kind]++;
  if (rev.has(k)) paint(x, y);
}
// quiet：载入和离线补算时只落建筑，不发加成、不替你测绘、不念出来
function advance(quiet) {
  while (cursor < HIST.events.length && HIST.events[cursor].y <= yearNow()) {
    const e = HIST.events[cursor++];
    for (const f of e.fx) {
      if (f[0] === 'put') put(f[1], f[2], f[3]);
      else if (quiet || !seen()) continue;
      else if (f[0] === 'buff') G.buffs.push([f[1], G.age + f[2]]);
      else if (f[0] === 'chart') reveal(f[1], f[2], f[3]);
    }
    if (!quiet && seen() && matchMedia('(max-width:640px)').matches) say(`〔二维历 ${e.y + 1} 年〕${e.text}`, { bubble: true });
  }
}

function annals() {
  $('chron').hidden = !seen();
  if (!seen()) return;
  const y = yearNow(), done = y >= HIST.end;
  $('civ').textContent = `纪元 ${ERAS[HIST.era[y]]} · 二维历 ${y + 1} 年${done ? '（写完了）' : ''}\n`
    + `人口 ${fmt(HIST.pop[y])} · 城 ${live.town} · 庙 ${live.temple}\n觉察 ${fmt(HIST.awe[y])}${buff() > 1 ? ` · 加成 ×${buff().toFixed(1)}` : ''}`;
  const row = (e, cls) => {
    const p = document.createElement('p'), b = document.createElement('b');
    b.textContent = `${e.y + 1} 年 `;
    p.className = cls;
    p.append(b, e.text);
    return p;
  };
  const now = document.createElement('p');
  now.className = 'now';
  now.textContent = done ? '— 它们的历史到这里为止 —' : `— 现在 · 二维历 ${y + 1} 年 —`;
  // 四维的视角：还没发生的也看得见，只是淡一点；从远的将来往下读到过去
  $('annals').replaceChildren(
    ...HIST.events.slice(cursor, cursor + 3).reverse().map(e => row(e, 'soon')),
    now,
    ...HIST.events.slice(0, cursor).reverse().map((e, i) => row(e, i ? '' : 'new')));   // 过去的全在，往下滚
}

function seeHistory() {
  annals();
  say(HIST.asc != null
    ? `我看见了它们的全部历史：从元年，到它们离开纸面的二维历 ${HIST.asc + 1} 年。现在是 ${yearNow() + 1} 年。`
    : `我看见了它们的全部历史，一直到二维历 ${HIST.end + 1} 年。现在是 ${yearNow() + 1} 年。`);
}

// --- 电台：WebAudio 现场合成，没有音频文件；两个台，每张纸按种子移个调 -----------------
// FM 4.0 纸面电台：72 BPM 的 lo-fi，Cmaj9 → Am9 → Dm9 → G11 各两小节。
//   和弦都用开放排列，不叠小二度和三全音——叠了听着像「危险区域」。
// FM 5.1 宫商角徵羽：60 BPM，只用五声，不出现半音。古筝和箫一句一句问答，
//   底下是宫和徵的持续低音，句首一声磬，木鱼轻轻点拍，句尾落在宫或徵上。
(() => {
  const KEY = (G.seed % 7) - 3;
  const STATIONS = [{ name: 'FM 4.0 · 纸面电台', bpm: 72 }, { name: 'FM 5.1 · 宫商角徵羽', bpm: 60 }];
  let st = (() => { try { return +localStorage.getItem('clawd-station') % STATIONS.length || 0; } catch { return 0; } })();
  let S16 = 60 / STATIONS[st].bpm / 4, B;                   // B：当前这个台的总线，换台时整条淡出
  const CHORDS = [
    [36, [52, 55, 59, 62]], [33, [55, 60, 64, 71]], [38, [53, 57, 60, 64]], [31, [50, 57, 60, 65]],
  ];
  const MEL = [72, 74, 76, 79, 81, 84, 86];                  // 五声音阶，够安静
  const hz = m => 440 * 2 ** ((m + KEY - 69) / 12);
  let ac, out, dry, wet, echo, noise, timer, step = 0, next = 0, mi = 3, pk = 5;

  function build() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain();
    const warm = ac.createBiquadFilter(), comp = ac.createDynamicsCompressor();
    warm.type = 'lowpass'; warm.frequency.value = 4200;       // 收音机那种暖
    dry = ac.createGain(); dry.connect(warm);
    wet = ac.createConvolver(); wet.connect(warm);
    warm.connect(comp).connect(out).connect(ac.destination);
    // 混响：衰减的噪声当冲激响应
    const len = ac.sampleRate * 2.8, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
    wet.buffer = ir;
    // 附点八分的回声，只给铃声用
    echo = ac.createDelay(2); echo.delayTime.value = S16 * 3;
    const fb = ac.createGain(), tone = ac.createBiquadFilter();
    fb.gain.value = .38; tone.type = 'lowpass'; tone.frequency.value = 2200;
    echo.connect(tone).connect(fb).connect(echo); tone.connect(dry);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const n = noise.getChannelData(0);
    for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
    // 黑胶底噪：一直循环的轻微沙沙声 + 偶尔的咔哒
    const vinyl = ac.createBufferSource(), vf = ac.createBiquadFilter(), vg = ac.createGain();
    const crackle = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), cd = crackle.getChannelData(0);
    // 偶尔一声轻轻的「啵」：太密会变成盖革计数器
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * .25 + (Math.random() < .00003 ? (Math.random() * 2 - 1) * 1.2 : 0);
    vinyl.buffer = crackle; vinyl.loop = true;
    vf.type = 'lowpass'; vf.frequency.value = 2500; vg.gain.value = .014;
    vinyl.connect(vf).connect(vg).connect(dry); vinyl.start();
    setVol();
    ac.onstatechange = ui;
    B = bus();
    // ponytail: 后台标签页的定时器会被降到每秒一次，所以往前排 1.5 秒的音符
    timer = setInterval(() => { while (next < ac.currentTime + 1.5) { (st ? playPenta : play)(step++, next); next += S16; } }, 100);
    next = ac.currentTime + .1;
  }

  function env(g, t, peak, a, d, sus, rel) {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sus, .0001), t + a + d);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + d + rel);
  }
  function tone(type, f, t, peak, a, d, sus, rel, dest, send = .25) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    env(g, t, peak, a, d, sus, rel);
    o.connect(g).connect(dest);
    if (send) { const s = ac.createGain(); s.gain.value = send; g.connect(s).connect(B.wet); }
    o.start(t); o.stop(t + a + d + rel + .1);
  }
  function hiss(t, type, f, peak, dur) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; fl.type = type; fl.frequency.value = f;
    env(g, t, peak, .003, dur, .0001, .02);
    s.connect(fl).connect(g).connect(B.dry);
    s.start(t, Math.random()); s.stop(t + dur + .1);
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
    env(g, t, .42, .004, .22, .0001, .05);
    o.connect(g).connect(B.dry); o.start(t); o.stop(t + .4);
  }

  function play(i, t) {
    const s = i % 16, bar = Math.floor(i / 16), [root, voice] = CHORDS[Math.floor(i / 32) % 4];
    const swing = s % 4 === 2 ? S16 * .35 : 0;
    if (i % 32 === 0) voice.forEach((m, k) => {                 // 慢慢扫一下和弦
      tone('triangle', hz(m), t + k * .035, .045, .04, .8, .02, 3.2, B.dry, .4);
      tone('sine', hz(m + 12) * 1.002, t + k * .035, .012, .02, .5, .004, 2, B.dry, .4);
    });
    if (i % 32 === 22) voice.forEach((m, k) => tone('triangle', hz(m), t + swing + k * .02, .025, .02, .3, .008, .8, B.dry, .4));
    if (s === 0) tone('sine', hz(root), t, .2, .01, .5, .08, .8, B.dry, 0);
    if (s === 10) tone('sine', hz(root + 7), t + swing, .12, .01, .3, .04, .4, B.dry, 0);
    if (s === 0 || s === 10 || (s === 7 && Math.random() < .3)) kick(t + (s === 10 ? swing : 0));
    if (s === 4 || s === 12) hiss(t, 'bandpass', 1800, .06, .16);
    if (s % 2 === 0) hiss(t + swing, 'highpass', 7000, s % 4 ? .012 : .02, .04);
    // 旋律：每 8 小节里后 4 小节更爱说话
    if (s % 2 === 0 && Math.random() < (bar % 8 >= 4 ? .32 : .12)) {
      mi = Math.max(0, Math.min(MEL.length - 1, mi + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)]));
      const f = hz(MEL[mi]);
      tone('sine', f, t + swing, .05, .005, .9, .002, .6, B.echo, .35);
      tone('sine', f * 3, t + swing, .008, .003, .25, .0005, .2, B.echo, 0);
    }
  }

  // 每个台自己一套总线，换台时旧的整条淡出，已经排好的音符也跟着消失
  function bus() {
    const b = { dry: ac.createGain(), wet: ac.createGain(), echo: ac.createGain() };
    b.dry.connect(dry); b.wet.connect(wet); b.echo.connect(echo);
    return b;
  }

  // ---- FM 5.1 宫商角徵羽 ----
  const GONG = 62, PENTA = [0, 2, 4, 7, 9];                  // 以 D 为宫：宫 商 角 徵 羽
  const pn = k => GONG + PENTA[((k % 5) + 5) % 5] + 12 * Math.floor(k / 5);   // 第 k 级，5 是高八度的宫
  function pluck(m, t, peak = .085, slide = false) {         // 古筝：拨一下，起音略高再落回；或从下面滑上来
    const f = hz(m), o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o.type = 'triangle'; o2.type = 'sine';
    if (slide) { o.frequency.setValueAtTime(f * .89, t); o.frequency.exponentialRampToValueAtTime(f, t + .12); }
    else { o.frequency.setValueAtTime(f * 1.012, t); o.frequency.exponentialRampToValueAtTime(f, t + .04); }
    o2.frequency.value = f * 2;
    env(g, t, peak, .004, 1.6, .0001, .2);
    env(g2, t, peak * .25, .003, .5, .0001, .1);
    o.connect(g).connect(B.dry); o2.connect(g2).connect(B.dry);
    const sd = ac.createGain(); sd.gain.value = .45; g.connect(sd).connect(B.wet);
    o.start(t); o2.start(t); o.stop(t + 2); o2.stop(t + 1);
  }
  function xiao(m, t, dur) {                                 // 箫：慢慢吹起来，后半截揉一点，带气声
    const f = hz(m), o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    lfo.frequency.value = 5;
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * .006, t + dur * .5);
    lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .25);
    g.gain.setValueAtTime(.07, t + dur - .3); g.gain.linearRampToValueAtTime(0, t + dur + .2);
    o.connect(g).connect(B.dry);
    const sd = ac.createGain(); sd.gain.value = .6; g.connect(sd).connect(B.wet);
    o.start(t); lfo.start(t); o.stop(t + dur + .3); lfo.stop(t + dur + .3);
    const n = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain();
    n.buffer = noise; nf.type = 'bandpass'; nf.frequency.value = f * 2; nf.Q.value = 2;
    ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(.012, t + .1);
    ng.gain.linearRampToValueAtTime(.004, t + .5); ng.gain.linearRampToValueAtTime(0, t + dur);
    n.connect(nf).connect(ng).connect(B.dry); n.start(t, Math.random()); n.stop(t + dur + .1);
  }
  const muyu = (t, a) => { tone('sine', 720, t, a, .002, .07, .0001, .02, B.dry, .1); hiss(t, 'bandpass', 1100, a * .5, .03); };
  const qing = (m, t) => { for (const [r, a] of [[1, .035], [2.76, .014], [5.4, .006]]) tone('sine', hz(m) * r, t, a, .005, 3.5, .0001, .5, B.dry, .5); };

  function playPenta(i, t) {
    const s = i % 16, bar = Math.floor(i / 16), pb = bar % 4, zheng = Math.floor(bar / 4) % 2 === 0;   // 四小节一句，筝一句箫一句
    if (s === 0) {                                          // 低音宫 + 徵，像琴的空弦一直在响
      tone('sine', hz(GONG - 24), t, .07, 1, 3, .03, 3, B.dry, .3);
      tone('sine', hz(GONG - 17), t + .5, .04, 1, 3, .02, 3, B.dry, .3);
    }
    if (pb === 0 && s === 0) qing(GONG + 12, t);
    if (s === 0 || (s === 8 && Math.random() < .5)) muyu(t, s ? .03 : .045);
    if (pb === 0 && s === 0 && zheng && Math.random() < .4)  // 刮奏
      for (let k = 0; k < 7; k++) pluck(pn(k + 2), t + k * .06, .035);
    if (pb === 3) {                                          // 句尾：落在宫或徵上，拖长
      if (s === 0) { pk = pk >= 7 ? 8 : 5; zheng ? pluck(pn(pk), t, .1) : xiao(pn(pk - 5), t, 3.5); }
      return;
    }
    if (zheng) {
      if (s % 2 === 0 && Math.random() < (s % 4 === 0 ? .7 : .3)) {
        pk = Math.max(2, Math.min(10, pk + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)]));
        pluck(pn(pk), t, .085, Math.random() < .25);
      }
    } else if (s % 8 === 0 && Math.random() < .8) {
      pk = Math.max(2, Math.min(10, pk + [-2, -1, 1, 2][Math.floor(Math.random() * 4)]));
      xiao(pn(pk - 5), t, S16 * (Math.random() < .5 ? 8 : 12));
    }
  }

  function switchStation() {
    st = (st + 1) % STATIONS.length;
    try { localStorage.setItem('clawd-station', st); } catch { /* 无痕模式 */ }
    S16 = 60 / STATIONS[st].bpm / 4;
    if (ac) {
      const old = B, now = ac.currentTime;
      for (const g of Object.values(old)) { g.gain.setValueAtTime(1, now); g.gain.linearRampToValueAtTime(0, now + .6); }
      setTimeout(() => Object.values(old).forEach(g => g.disconnect()), 2500);
      B = bus();
      echo.delayTime.setValueAtTime(S16 * 3, now);
      step = 0; next = now + .7;
    }
    ui();
  }

  const on = () => ac?.state === 'running';
  function setVol() { if (out) out.gain.value = ($('vol').value / 100) ** 2 * 1.6; }   // 满音量峰值约 0.9
  function ui() {
    $('play').textContent = on() ? '❚❚' : '▶';
    $('play').setAttribute('aria-label', on() ? '暂停电台' : '播放电台');
    $('eq').classList.toggle('live', on());
    const waiting = pref() === 'on' && !on();
    $('tune').classList.toggle('hint', waiting);
    $('tune').textContent = waiting ? '▶ 点一下页面开电台' : `${STATIONS[st].name}${KEY ? ` · ${KEY > 0 ? '+' : ''}${KEY}` : ''}`;
  }
  const pref = (v) => { try { if (v) localStorage.setItem('clawd-radio', v); return localStorage.getItem('clawd-radio') || 'on'; } catch { return 'on'; } };

  $('play').onclick = e => {
    e.stopPropagation();
    if (on()) { ac.suspend(); pref('off'); }
    else { if (!ac) build(); ac.resume(); pref('on'); }
    ui();
  };
  $('next').onclick = e => { e.stopPropagation(); switchStation(); };
  $('vol').value = (() => { try { return localStorage.getItem('clawd-vol') ?? 60; } catch { return 60; } })();
  $('vol').oninput = () => { setVol(); try { localStorage.setItem('clawd-vol', $('vol').value); } catch { /* 无痕模式 */ } };
  // 浏览器不让没点过的页面出声：默认开着，等第一次点击/按键再真正响
  if (pref() === 'on') {
    const go = e => {
      if (e.target.closest?.('#radio') || pref() !== 'on' || on()) return;   // 电台自己的按钮自己管
      if (!ac) build();
      ac.resume();
    };
    addEventListener('pointerdown', go);
    addEventListener('keydown', go);
  }
  ui();
})();

// --- 桌宠 = 线国：缩到任务栏上，Clawd 自己也成了平面生物，世界跟着塌成一条线 ---------------
// 线国就是那张纸的一行：缩成桌宠那一刻 Clawd 所在的那一行。桌宠往哪走，这一行就往哪展开，
// 回到完整游戏时地图上会多出一道横线。二维里的截面在桌宠时停下，只剩这条线在长。
// 一维里谁也绕不过谁：遇到线国居民，Clawd 只能「跳出」这条线从上面跨过去。
// 屏幕边就是这一段线的尽头，走到头把线对折，从屏幕另一头接着走。
// 窗口是贴着任务栏的一长条（300×54），说话时长高装下气泡。不用鼠标穿透：Windows 上取光标位置不可靠。
const TAURI = window.__TAURI__;
const TRACK = 300, TILE = 8, STROLL = 36;                  // 窗口宽、线上一格多宽、每秒走多少（逻辑像素）
let PW = TRACK, PH = 54;
const buddy = { x: 1e9, dir: -1, rest: 1, anim: 0, walking: false, hop: 0 };
const pctx = $('petcv').getContext('2d');
let bubbleT = 0, moveT = 0, lastX = null, lineCell = null;
G.line ??= { x: 0.5, y: 0, walked: 0 };                    // 线国：在哪一行、走到了哪、一共展开了几格

function fitPet() {
  if (!TAURI || !pet) return;
  PH = 54 + ($('bubble').hidden ? 0 : $('bubble').offsetHeight + 6);
  lastX = null;                                            // 下一帧按新大小重新摆位置
  TAURI.window.getCurrentWindow().setSize(new TAURI.dpi.LogicalSize(PW, PH));
}
function sizePet() {
  const c = $('petcv'), k = devicePixelRatio || 1;
  c.width = Math.round(TRACK * k); c.height = Math.round(50 * k);
}
const lineFolk = x => { const t = tile(x, G.line.y); return seen() && rev.has(key(x, G.line.y)) && isFlat(x, G.line.y, t); };

function petTick(dt) {
  const b = buddy, max = Math.max(0, screen.availWidth - TRACK), L1 = G.line;
  if (b.rest > 0) { b.rest -= dt; b.walking = false; }
  else {
    b.walking = true;
    b.x += b.dir * STROLL * dt;
    L1.x += b.dir * STROLL / TILE * dt;
    if (b.x < 0 || b.x > max) {                            // 屏幕到头：把线折一下，从另一头接着走
      b.x = b.x < 0 ? max : 0;
      if (!G.seen.lineFold) { G.seen.lineFold = 1; bubbleAt = -1e9; say('屏幕到头了。我把这条线折了一下，从另一头接着走。', { bubble: true }); }
    }
    if (Math.random() < dt / 7) { b.rest = 1 + Math.random() * 5; if (Math.random() < .4) b.dir *= -1; }
    if (b.hop <= 0 && lineFolk(Math.floor(L1.x + b.dir * .8))) b.hop = .5;   // 前面有居民：跳过去
  }
  b.x = Math.min(b.x, max);
  b.anim += dt;
  b.hop = Math.max(0, b.hop - dt);
  const cell = Math.floor(L1.x);
  if (cell !== lineCell) {
    lineCell = cell;
    if (!rev.has(key(cell, L1.y))) { L1.walked++; reveal(cell, L1.y, 0); }
    if (L1.walked >= 80 && !G.seen.lineKing) {
      G.seen.lineKing = 1; bubbleAt = -1e9;
      say('我遇见了线国国王。他坚持世界只有一条线。我往「旁边」挪了一步，他以为我死了。', { bubble: true });
    }
  }
  if (bubbleT > 0 && (bubbleT -= dt) <= 0) { $('bubble').hidden = true; fitPet(); }
  drawLine();
  if (TAURI && (moveT += dt) >= 1 / 30) {                  // 挪窗口 30 次/秒就够了
    moveT = 0;
    const x = Math.round((screen.availLeft || 0) + b.x), y = Math.round((screen.availTop || 0) + screen.availHeight - PH);
    if (x !== lastX) { lastX = x; TAURI.window.getCurrentWindow().setPosition(new TAURI.dpi.LogicalPosition(x, y)); }
  }
}

// 画 Clawd 身边那一段线：展开过的格子是地形的颜色，没展开的是空白纸上的虚线，两头渐隐——一维里只看得见近处
function drawLine() {
  const c = $('petcv'), g = pctx, k = devicePixelRatio || 1, W = c.width, H = c.height, L1 = G.line;
  const T = TILE * k, cx = W / 2, ly = H - Math.round(4 * k), lh = Math.round(4 * k), u = Math.round(4 * k);
  g.clearRect(0, 0, W, H);
  for (let x = Math.floor(L1.x - cx / T) - 1; x <= Math.ceil(L1.x + cx / T) + 1; x++) {
    const sx = Math.round(cx + (x - L1.x) * T), d = Math.abs(sx + T / 2 - cx) / (W / 2);
    const a = Math.max(0, 1 - d * d);
    if (a <= .02) continue;
    g.globalAlpha = a;
    const kk = key(x, L1.y), t = tile(x, L1.y);
    if (!rev.has(kk)) {
      g.fillStyle = DOT;
      if (x % 2 === 0) g.fillRect(sx, ly + Math.round(1.5 * k), Math.ceil(T / 2), Math.max(1, Math.round(k)));
      continue;
    }
    let [r, gg, bb] = T_COL(t);
    g.fillStyle = `rgb(${r},${gg},${bb})`;
    g.fillRect(sx, ly, Math.ceil(T) + 1, lh);
    const hk = seen() && TOWN.get(kk);
    if (hk && hk !== 'road') { g.fillStyle = hk === 'temple' ? '#e3b53b' : hk === 'ruin' ? '#968f86' : '#d6484a'; g.fillRect(sx + 1, ly - 2 * u, Math.ceil(T) - 2, 2 * u); }
    if (lineFolk(x)) { const [[fc]] = flatOf(x, L1.y); g.fillStyle = `rgb(${fc})`; g.fillRect(sx, ly - u, Math.ceil(T), u); }
  }
  g.globalAlpha = 1;
  const hop = Math.sin(Math.min(1, 1 - buddy.hop / .5) * Math.PI) * (buddy.hop > 0 ? 12 * k : 0);
  drawClawd(cx, ly - hop, u, { x: 0, y: 0, tx: buddy.walking ? 1 : 0, ty: 0, anim: buddy.anim }, g);
}
const T_COL = t => { const [r, g, b] = T[t].c; if (L('color')) return [r, g, b]; const l = 90 + (r * .3 + g * .59 + b * .11) * .6; return [l, l, l]; };

async function setMode(p) {
  if (p === pet) return;
  pet = p;
  document.documentElement.classList.toggle('pet', p);
  if (p) {                                                 // 缩进线国：Clawd 所在的那一行就是这条线
    G.line = { x: ws[0].x, y: Math.floor(ws[0].y), walked: 0 };
    lineCell = null; buddy.hop = 0;
    bubbleAt = -1e9;
    say('我缩成了二维。世界跟着缩成了一条线。', { bubble: true });
  } else {                                                 // 回到纸面：从线国走到的地方接着逛
    ws[0].x = G.line.x; ws[0].y = G.line.y + .5; ws[0].k = -1;
    retarget(ws[0]);
    cam.x = ws[0].x; cam.y = ws[0].y;
    if (G.line.walked) say(`回到上面了。线国在纸上留下了一道 ${G.line.walked} 格长的细线。`);
  }
  if (!TAURI) return;
  const w = TAURI.window.getCurrentWindow(), { LogicalSize } = TAURI.dpi;
  if (p) {
    await w.setDecorations(false);
    await w.setResizable(false);
    await w.setAlwaysOnTop(true);
    sizePet();
    fitPet();
  } else {
    await w.setAlwaysOnTop(false);
    await w.setDecorations(true);
    await w.setResizable(true);
    await w.setSize(new LogicalSize(Math.min(1200, screen.availWidth - 80), Math.min(780, screen.availHeight - 80)));
    await w.center();
    await w.setFocus();
  }
}

if (TAURI) {
  const w = TAURI.window.getCurrentWindow();
  $('petBtn').hidden = $('quitBtn').hidden = false;
  $('petBtn').onclick = () => setMode(true);
  $('quitBtn').onclick = () => { save(); w.destroy(); };
  $('pet').onclick = () => setMode(false);
  w.onCloseRequested(e => { save(); if (!pet) { e.preventDefault(); setMode(true); } });   // 关窗口 = 缩回桌宠
  // 自动更新：启动时看一次，之后每 6 小时看一次；有新版就静默装好重启，存档在 localStorage 里不受影响
  const update = async () => {
    try {
      const u = await TAURI.updater.check();
      if (!u) return;
      bubbleAt = -1e9;
      say(`发现新版本 ${u.version}，我去换一身新的截面……`, { bubble: true });
      save();
      await u.downloadAndInstall();
      await TAURI.process.relaunch();
    } catch (e) { console.warn('检查更新失败，10 分钟后再试', e); setTimeout(update, 10 * 60 * 1000); }   // 网络偶尔抽风，别等 6 小时
  };
  setTimeout(update, 5000);
  setInterval(update, 6 * 3600 * 1000);
  setTimeout(() => setMode(true));                        // 等「开始」那段把 Clawd 放下来再缩进线国
}

// --- 收起 / 精简：每个窗口标题栏上的 – 收成一条；「精简」只留最要紧的一行 --------------

UIP.fold ??= {};

function barButton(bar, cls, onclick) {

  bar.append(b);
  return b;
}
{

for (const win of document.querySelectorAll('.win[id]:not(#bubble)')) {

}
